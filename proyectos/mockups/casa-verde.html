<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Verde — Interiorismo y arquitectura</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mockups.css">
</head>
<body class="theme-casa layout-editorial">
  <header class="mock-nav">
    <span class="mock-brand">Casa Verde</span>
    <nav aria-label="Navegación de muestra">
      <span>Proyectos</span>
      <span>Estudio</span>
      <span>Contacto</span>
    </nav>
    <span class="mock-navcta">Hablemos</span>
  </header>

  <main class="mock-hero">
    <div class="mock-copy">
      <p class="mock-eyebrow">Interiorismo · Arquitectura</p>
      <h1 class="mock-title">Espacios<br><em>que respiran.</em></h1>
      <p class="mock-lead">
        Diseñamos interiores con luz, materia y tiempo. Menos cosas,
        mejor puestas, para que la casa se sienta tuya.
      </p>
      <div class="mock-actions">
        <span class="mock-btn">Ver proyectos</span>
        <span class="mock-btn mock-btn--ghost">El estudio</span>
      </div>
    </div>

    <div class="mock-visual" aria-hidden="true">
      <div class="visual-casa__arch"></div>
      <div class="visual-casa__plant"><i></i><i></i><i></i></div>
      <div class="visual-casa__swatches"><span></span><span></span><span></span></div>
      <div class="visual-casa__caption">Casa Olivo · 2025</div>
    </div>
  </main>

  <footer class="mock-strip">
    <span>Vivienda</span>
    <span>Hostelería</span>
    <span>Retail</span>
    <span>Dirección de obra</span>
  </footer>
</body>
</html>
